
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zene_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zene_test_password}
      POSTGRES_DB: ${POSTGRES_DB:-zene_test}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-zene_test}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-zene_test_password}
    ports:
      - "127.0.0.1:57017:27017"
    volumes:
      - mongo-test-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok'"
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-zene_test_password}
    command:
      - redis-server
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:-zene_test_password}
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20

  surrealdb:
    image: surrealdb/surrealdb:v3.3.0
    restart: unless-stopped
    user: root
    command:
      - start
      - --unauthenticated
      - --bind
      - 0.0.0.0:8000
      - rocksdb:/data/test.db
    ports:
      - "127.0.0.1:58000:8000"
    volumes:
      - surreal-test-data:/data

volumes:
  postgres-test-data:
  mongo-test-data:
  surreal-test-data: