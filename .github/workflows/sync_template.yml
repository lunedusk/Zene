name: Sync Plugin Template

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to sync (e.g. v0.1.10)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-plugin-template
  cancel-in-progress: false

jobs:
  sync-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Core → plugin-template
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Making plugin-template match $TAG (linear, no force-push)"

          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git fetch --tags origin "${TAG}"
          fi
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
            || { echo "::error::Tag ${TAG} not found"; exit 1; }

          if git ls-remote --exit-code --heads origin plugin-template >/dev/null 2>&1; then
            git checkout -B plugin-template origin/plugin-template
          else
            git checkout -B plugin-template "${TAG}"
          fi

          git read-tree -u --reset "${TAG}"

          echo "${TAG}" > .core-version
          git add -A

          if git diff --cached --quiet; then
            echo "plugin-template already matches ${TAG}; nothing to do."
            exit 0
          fi
          git commit -m "chore: sync plugin-template to ${TAG}"

          git config --unset-all http.https://github.com/.extraheader || true

          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin plugin-template